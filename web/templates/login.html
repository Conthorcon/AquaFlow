<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — AquaFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Background Decor -->
    <div class="absolute top-0 left-0 w-96 h-96 bg-blue-400 opacity-20 blur-3xl rounded-full -translate-x-1/2 -translate-y-1/2"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-indigo-400 opacity-20 blur-3xl rounded-full translate-x-1/2 translate-y-1/2"></div>

    <div class="w-full max-w-md relative">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-10">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-2xl shadow-blue-200 mb-4 rotate-3 transform hover:rotate-0 transition-all duration-500">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-10 10-2-2m-2-2v10l8 4 8-4V10l-8 4z" /></svg>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">AquaFlow</h1>
            <p class="text-slate-500 mt-2 font-medium">Hệ thống quản lý thông minh</p>
        </div>

        <div class="glass p-8 rounded-[2rem] shadow-2xl shadow-slate-200/50">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="mb-6 p-4 rounded-xl text-sm font-semibold bg-red-50 text-red-600 border border-red-100 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="/login" method="POST" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Tên đăng nhập</label>
                    <input type="text" name="username" required 
                        placeholder="Nhập tên đăng nhập"
                        class="w-full bg-white/50 border border-slate-200 rounded-2xl p-4 text-slate-700 outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400 transition-all duration-300">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Mật khẩu</label>
                    <input type="password" name="password" required 
                        placeholder="••••••••"
                        class="w-full bg-white/50 border border-slate-200 rounded-2xl p-4 text-slate-700 outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400 transition-all duration-300">
                </div>
                
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-200 transition-all duration-300 active:scale-[0.98] mt-4">
                    Đăng nhập hệ thống
                </button>
            </form>
        </div>

        <p class="text-center mt-8 text-slate-400 text-sm">
            Yêu cầu hỗ trợ? <span class="text-blue-500 font-semibold cursor-pointer hover:underline">Liên hệ kỹ thuật viên</span>
        </p>
    </div>
</body>
</html>
